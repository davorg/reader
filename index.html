<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article Extractor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2430;
      --muted: #5d6877;
      --paper: #fffaf1;
      --panel: #ffffff;
      --line: #d9d2c4;
      --accent: #146c94;
      --accent-dark: #0f526f;
      --warm: #d9822b;
      --error: #9f1239;
      --shadow: 0 24px 70px rgba(29, 36, 48, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(115deg, rgba(20, 108, 148, 0.12), transparent 42%),
        linear-gradient(22deg, rgba(217, 130, 43, 0.14), transparent 48%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    .masthead {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      max-width: 760px;
      font-size: clamp(2.4rem, 7vw, 5rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 1.12rem;
    }

    .tool {
      display: grid;
      gap: 16px;
      margin: 30px 0 22px;
      padding: 18px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 56px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: 1rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(20, 108, 148, 0.16);
    }

    button {
      height: 56px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: 800 1rem/1 system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .status {
      min-height: 24px;
      color: var(--muted);
      font-weight: 650;
    }

    .status.error {
      color: var(--error);
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 34px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 42px rgba(29, 36, 48, 0.1);
    }

    .result.visible {
      display: block;
    }

    .result h2 {
      margin: 0 0 24px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .article-body p {
      margin: 1em 0 0;
      font-size: 1.08rem;
    }

    .article-body p:first-child {
      margin-top: 0;
    }

    .empty-note {
      margin: 0;
      color: var(--muted);
      font-style: italic;
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 24px, 980px);
        padding: 32px 0;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .result {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="masthead" aria-labelledby="page-title">
      <h1 id="page-title">Give me a URL</h1>
      <p class="lede">Paste an article URL that your browser is allowed to fetch, and this page will pull out the likely title and readable paragraphs.</p>
    </section>

    <form class="tool" id="extractor">
      <label for="url">Article URL</label>
      <div class="input-row">
        <input id="url" name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://example.com/story" required>
        <button id="submit" type="submit">OK</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <article class="result" id="result" aria-live="polite">
      <h2 id="article-title"></h2>
      <div class="article-body" id="article-body"></div>
    </article>
  </main>

  <script>
    const form = document.querySelector("#extractor");
    const urlInput = document.querySelector("#url");
    const submitButton = document.querySelector("#submit");
    const statusEl = document.querySelector("#status");
    const resultEl = document.querySelector("#result");
    const titleEl = document.querySelector("#article-title");
    const bodyEl = document.querySelector("#article-body");

    const titleSelectors = [
      'meta[property="mol:headline"]',
      'meta[property="og:title"]',
      'meta[name="twitter:title"]',
      'meta[name="headline"]',
      'h1',
      'title'
    ];

    const paragraphSelectors = [
      "p.mol-para-with-font",
      "article p",
      "main p",
      '[role="main"] p',
      ".article p",
      ".story p"
    ];

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function getText(documentNode, selectors) {
      for (const selector of selectors) {
        const node = documentNode.querySelector(selector);
        const text = node?.content || node?.textContent;
        if (text?.trim()) {
          return text.trim();
        }
      }

      return "";
    }

    function getParagraphs(documentNode) {
      for (const selector of paragraphSelectors) {
        const paragraphs = [...documentNode.querySelectorAll(selector)]
          .map((paragraph) => paragraph.textContent.trim().replace(/\s+/g, " "))
          .filter((text) => text.length > 0);

        if (paragraphs.length > 0) {
          return paragraphs;
        }
      }

      return [];
    }

    function renderArticle(title, paragraphs) {
      titleEl.textContent = title || "Untitled article";
      bodyEl.textContent = "";

      if (paragraphs.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-note";
        empty.textContent = "No readable paragraphs were found with the current selectors.";
        bodyEl.appendChild(empty);
      } else {
        for (const text of paragraphs) {
          const paragraph = document.createElement("p");
          paragraph.textContent = text;
          bodyEl.appendChild(paragraph);
        }
      }

      resultEl.classList.add("visible");
    }

    async function fetchArticle(url) {
      const corsfix = "https://feeds.davecross.co.uk/url/";
      console.log(corsfix + url);
      const response = await fetch(corsfix + url, {
        method: "GET",
        mode: "cors",
        credentials: "omit"
      });

      if (!response.ok) {
        throw new Error(`The page returned HTTP ${response.status}.`);
      }

      const contentType = response.headers.get("content-type") || "";
      if (!contentType.includes("text/html")) {
        throw new Error("That URL did not return an HTML page.");
      }

      return response.text();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const url = urlInput.value.trim();
      if (!url) {
        return;
      }

      resultEl.classList.remove("visible");
      submitButton.disabled = true;
      setStatus("Fetching the page...");

      try {
        const html = await fetchArticle(url);
        const doc = new DOMParser().parseFromString(html, "text/html");
        const title = getText(doc, titleSelectors);
        const paragraphs = getParagraphs(doc);

        renderArticle(title, paragraphs);
        setStatus(`Found ${paragraphs.length} paragraph${paragraphs.length === 1 ? "" : "s"}.`);
      } catch (error) {
        setStatus(`${error.message} Browser security may block this URL unless the site allows cross-origin requests.`, true);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
