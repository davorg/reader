<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YJCYWQFHGB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YJCYWQFHGB');
  </script>
  <title>Article reader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="masthead" aria-labelledby="page-title">
      <h1 id="page-title">Article reader</h1>
      <p class="lede">Paste an article URL that your browser is allowed to
        fetch, and this page will pull out the likely title and readable
        paragraphs.</p>
    </section>

    <form class="tool" id="extractor">
      <label for="url">Article URL</label>
      <div class="input-row">
        <input id="url" name="url" type="url" inputmode="url"
               autocomplete="url" placeholder="https://example.com/story"
               required>
        <button id="submit" type="submit">OK</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <article class="result" id="result" aria-live="polite">
      <h2 id="article-title"></h2>
      <div class="article-body" id="article-body"></div>
    </article>
  </main>

  <footer>
    Created by <a href="https://davecross.co.uk/">Dave Cross</a> /
    Code on <a href="https://github.com/davorg/reader">GitHub</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
